<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Библиотека</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508; --text: #e0e0e8; --text-dim: #8a8aa0;
    --accent: #ff2a3c; --accent-soft: rgba(255, 42, 60, 0.15);
    --accent-glow: rgba(255, 42, 60, 0.6); --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; overflow: hidden; }
  body {
    height: 100vh; height: 100dvh; overflow: hidden;
    background: radial-gradient(circle at 50% 0%, rgba(255, 42, 60, 0.08) 0%, transparent 55%), var(--bg);
    color: var(--text);
    font-family: 'Lora', Georgia, serif; font-size: 16px; line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  #app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

  .view {
    flex: 1; min-height: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .view.active { display: block; }

  /* ---------- БИБЛИОТЕКА ---------- */
  .library-wrap {
    max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem;
    display: flex; flex-direction: column; gap: 1.5rem;
  }
  .lib-header { text-align: center; margin-bottom: 0.5rem; }
  .lib-header h1 {
    font-family: 'Exo 2', sans-serif; font-weight: 900;
    font-size: clamp(1.6rem, 6vw, 2.2rem); letter-spacing: 0.2em;
    color: #fff; margin-bottom: 0.4rem;
  }
  .lib-header p {
    font-family: 'Exo 2', sans-serif; font-weight: 300;
    font-size: 0.75rem; letter-spacing: 0.35em;
    text-transform: uppercase; color: var(--text-dim);
  }

  .book-card {
    display: flex; gap: 1.2rem; padding: 1rem;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; text-align: left; width: 100%;
    color: inherit; font: inherit;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .book-card:active {
    transform: scale(0.98);
    border-color: rgba(255,42,60,0.5);
    box-shadow: 0 0 30px var(--accent-soft);
  }
  .book-cover {
    flex: 0 0 88px; aspect-ratio: 9/16; max-height: 156px;
    border-radius: 3px; overflow: hidden; border: 1px solid var(--border);
    background: linear-gradient(160deg, #1a0a0e 0%, #2a0d12 50%, #050508 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .book-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .book-cover .cover-fallback {
    font-family: 'Exo 2', sans-serif; font-weight: 900;
    font-size: 0.85rem; letter-spacing: 0.15em; color: #fff;
    text-shadow: 0 0 12px var(--accent-glow); text-align: center; padding: 0.4rem;
  }
  .book-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0.35rem; min-width: 0; }
  .book-info .tagline {
    font-family: 'Exo 2', sans-serif; font-size: 0.65rem;
    letter-spacing: 0.35em; text-transform: uppercase; color: var(--accent);
  }
  .book-info .title {
    font-family: 'Exo 2', sans-serif; font-weight: 900;
    font-size: 1.35rem; letter-spacing: 0.05em; color: #fff; line-height: 1.1;
  }
  .book-info .author {
    font-family: 'Exo 2', sans-serif; font-weight: 300;
    font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-dim);
  }
  .book-progress {
    margin-top: 0.5rem; display: flex; align-items: center; gap: 0.6rem;
    font-family: 'Exo 2', sans-serif; font-size: 0.7rem;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim);
  }
  .progress-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); transition: width 0.4s ease; }

  /* ---------- TOPBAR ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 1.25rem;
    padding-top: calc(0.9rem + env(safe-area-inset-top, 0px));
    background: rgba(5, 5, 8, 0.96);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-family: 'Exo 2', sans-serif;
    font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 0.4rem 0; display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .topbar-btn:active { color: var(--accent); }
  .topbar-title {
    font-family: 'Exo 2', sans-serif; font-size: 0.72rem;
    letter-spacing: 0.4em; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%;
  }

  /* ---------- КНИГА (TOC) ---------- */
  .book-view-wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .book-hero { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; text-align: center; margin-bottom: 2.5rem; }
  .book-hero .cover-frame {
    width: min(60vw, 220px); aspect-ratio: 9/16;
    border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
    box-shadow: 0 15px 50px rgba(0,0,0,0.8), 0 0 30px var(--accent-soft);
    background: linear-gradient(160deg, #1a0a0e 0%, #2a0d12 50%, #050508 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .book-hero .cover-frame img { width: 100%; height: 100%; object-fit: cover; }
  .book-hero .cover-frame .cover-fallback {
    font-family: 'Exo 2', sans-serif; font-weight: 900;
    font-size: 1.6rem; letter-spacing: 0.2em; color: #fff;
    text-shadow: 0 0 20px var(--accent-glow);
  }
  .book-hero .title-glitch {
    font-family: 'Exo 2', sans-serif; font-weight: 900;
    font-size: clamp(2rem, 9vw, 3rem); letter-spacing: 0.12em; color: #fff;
  }
  .book-hero .author-name {
    font-family: 'Exo 2', sans-serif; font-weight: 300;
    font-size: 0.85rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--text-dim);
  }

  .btn-primary {
    display: block; width: 100%; max-width: 320px; margin: 0 auto;
    padding: 1rem 2rem; background: transparent;
    border: 1px solid var(--accent); color: var(--text);
    font-family: 'Exo 2', sans-serif; font-weight: 700;
    font-size: 0.9rem; letter-spacing: 0.3em; text-transform: uppercase;
    border-radius: 2px; box-shadow: 0 0 20px var(--accent-soft);
    cursor: pointer; transition: all 0.25s ease;
  }
  .btn-primary:active { transform: scale(0.97); box-shadow: 0 0 40px var(--accent-glow); }

  .toc { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 2rem; }
  .toc-title {
    font-family: 'Exo 2', sans-serif; font-size: 0.7rem;
    letter-spacing: 0.4em; text-transform: uppercase; color: var(--accent);
    margin-bottom: 0.75rem; padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .toc-item {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.9rem 1rem; background: rgba(255,255,255,0.02);
    border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; text-align: left; width: 100%; color: inherit; font: inherit;
    transition: all 0.2s ease;
  }
  .toc-item:active { border-color: rgba(255,42,60,0.5); background: rgba(255,42,60,0.04); }
  .toc-num {
    font-family: 'Exo 2', sans-serif; font-weight: 900;
    font-size: 0.85rem; color: var(--accent); min-width: 1.5rem;
  }
  .toc-info { flex: 1; min-width: 0; }
  .toc-label {
    font-family: 'Exo 2', sans-serif; font-size: 0.65rem;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim);
  }
  .toc-name { font-family: 'Exo 2', sans-serif; font-weight: 500; font-size: 0.95rem; color: #fff; }
  .toc-arrow { color: var(--text-dim); font-size: 1.1rem; }
  .toc-item.read .toc-num { color: var(--text-dim); }

  /* ---------- READER ---------- */
  .reader-progress {
    position: absolute; top: 0; left: 0; height: 2px;
    background: var(--accent); box-shadow: 0 0 10px var(--accent-glow);
    width: 0%; z-index: 20; transition: width 0.1s linear;
  }
  .read-container { max-width: 720px; margin: 0 auto; padding: 2rem 1.2rem 5rem; position: relative; }

  .chapter-head { text-align: center; margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); position: relative; }
  .chapter-head::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 80px; height: 2px; background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
  .chapter-label { font-family: 'Exo 2', sans-serif; font-size: 0.8rem; letter-spacing: 0.5em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
  .chapter-title { font-family: 'Exo 2', sans-serif; font-weight: 900; font-size: clamp(1.8rem, 7vw, 2.6rem); color: #fff; margin-bottom: 0.5rem; }
  .chapter-sub { font-family: 'Lora', serif; font-style: italic; font-size: 1.05rem; color: var(--text-dim); }

  .prose p { font-size: clamp(1.02rem, 2.8vw, 1.12rem); line-height: 1.85; margin-bottom: 1.6rem; color: var(--text); text-align: justify; hyphens: auto; }
  .prose p.drop::first-letter { font-family: 'Exo 2', sans-serif; font-weight: 900; float: left; font-size: 4em; line-height: 0.8; padding: 0.1em 0.15em 0 0; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }

  .whisper {
    text-align: center !important; font-family: 'Exo 2', sans-serif !important;
    font-weight: 900; font-size: clamp(1.5rem, 6vw, 2.2rem) !important;
    letter-spacing: 0.6em !important; text-transform: uppercase;
    color: var(--accent) !important; padding: 2.2rem 0 2.2rem 0.6em !important;
    margin: 3rem 0 !important; text-shadow: 0 0 30px var(--accent-glow);
    border-top: 1px solid rgba(255,42,60,0.3); border-bottom: 1px solid rgba(255,42,60,0.3);
    background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
  }

  figure { margin: 2.5rem 0; }
  figure img { width: 100%; height: auto; display: block; border-radius: 4px; border: 1px solid var(--border); box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
  figcaption { margin-top: 1rem; font-family: 'Exo 2', sans-serif; font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); text-align: center; }

  .end-chapter { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border); text-align: center; }
  .end-mark { font-family: 'Exo 2', sans-serif; font-size: 0.75rem; letter-spacing: 0.6em; color: var(--text-dim); text-transform: uppercase; }

  .chapter-nav { display: flex; gap: 1rem; margin-top: 2rem; }
  .chapter-nav button {
    flex: 1; padding: 0.9rem; background: transparent;
    border: 1px solid var(--border); color: var(--text-dim);
    font-family: 'Exo 2', sans-serif; font-size: 0.75rem; letter-spacing: 0.2em;
    text-transform: uppercase; border-radius: 3px; cursor: pointer;
    transition: all 0.2s ease;
  }
  .chapter-nav button:active { border-color: var(--accent); color: var(--accent); }
  .chapter-nav button:disabled { opacity: 0.3; }

  @media (max-width: 600px) {
    .prose p { text-align: left; }
    .whisper { letter-spacing: 0.35em !important; font-size: 1.3rem !important; }
    .book-card { gap: 1rem; padding: 0.85rem; }
    .book-cover { flex-basis: 72px; max-height: 128px; }
    .book-info .title { font-size: 1.15rem; }
  }
</style>
</head>
<body>

<div id="app">
  <section class="view active" id="view-library">
    <div class="library-wrap">
      <div class="lib-header">
        <h1>БИБЛИОТЕКА</h1>
        <p>Голубцов Александр</p>
      </div>
      <div id="book-list"></div>
    </div>
  </section>

  <section class="view" id="view-book">
    <div class="topbar">
      <button class="topbar-btn" onclick="App.goLibrary()">← Меню</button>
      <div class="topbar-title" id="book-topbar-title">—</div>
      <div style="width:60px"></div>
    </div>
    <div class="book-view-wrap" id="book-content"></div>
  </section>

  <section class="view" id="view-reader">
    <div class="topbar" style="position:relative;">
      <div class="reader-progress" id="reader-progress"></div>
      <button class="topbar-btn" onclick="App.goBook()">← Глава</button>
      <div class="topbar-title" id="reader-topbar-title">—</div>
      <div style="width:60px"></div>
    </div>
    <div class="read-container" id="reader-content"></div>
  </section>
</div>

<template id="tpl-phantom-prologue">
  <header class="chapter-head">
    <div class="chapter-label">Пролог</div>
    <h2 class="chapter-title">Двенадцатый район</h2>
    <div class="chapter-sub">Двенадцать лет назад</div>
  </header>
  <article class="prose">
    <p class="drop">В Двенадцатом районе давно привыкли к тому, что «Гиперион» мог перекрыть улицу без предупреждения, отключить электричество на несколько часов или прислать патруль для проверки документов прямо посреди ночи. Жители ворчали, ругались на городские службы, писали жалобы, которые никто не читал, но на следующий день всё возвращалось на свои места, и постепенно даже самые неприятные ограничения становились частью привычной жизни. Поэтому, когда Айра с младшей сестрой Линой возвращались домой и на фасадах зданий одновременно загорелись красные сигнальные полосы, она сначала решила, что снова начались перебои в системе управления районом.</p>

    <figure>
      <img src="covers/img-0792.jpg" alt="Айра и Лина на площади">
      <figcaption>Айра и Лина</figcaption>
    </figure>

    <p>Лина шла рядом, придерживая одной рукой лямку старого рюкзака, а другой цеплялась за пальцы сестры. Ей было двенадцать, и она ещё не научилась скрывать любопытство, которое постоянно втягивало её в разговоры с незнакомцами и заставляло задавать вопросы в самые неподходящие моменты. Несколько минут назад она пыталась выяснить, почему в соседних кварталах по ночам иногда видны звёзды, а над их домами небо всегда закрывает световая дымка. Айра объяснила это рекламными экранами и промышленными выбросами, хотя сама никогда не проверяла, так ли это, и теперь надеялась, что сестра переключится на что-нибудь другое.</p>

    <p>Их квартира находилась в жилом секторе за станцией переработки, поэтому привычный маршрут проходил через небольшую площадь, откуда можно было свернуть в узкий переулок между техническими корпусами. Вечером здесь торговали дешёвой едой, ремонтировали бытовые устройства и продавали детали, снятые со старого оборудования; сейчас большинство ларьков уже закрывалось, а последние посетители торопились разойтись до начала комендантского часа. Айра заметила, что несколько уличных терминалов погасли одновременно, но не придала этому значения, пока над площадью не раздался голос городской системы.</p>

    <p>«Внимание. В связи с аварией в системе жизнеобеспечения Двенадцатого района вводится временное ограничение передвижения. Просим жителей сохранять спокойствие и следовать указаниям служб безопасности».</p>

    <p>Сообщение повторилось дважды. На информационных панелях появилась схема района с выделенными красным секторами, однако никаких сведений о характере аварии не было. Люди остановились, пытаясь разобраться в происходящем, а затем начали двигаться к южному выходу с площади, откуда можно было попасть на центральную магистраль. Айра тоже направилась туда, решив, что лучше переждать очередное отключение дома, где у них хотя бы оставался запас воды, чем задерживаться среди растущей толпы.</p>

    <p>У северного выезда в этот момент опустились бронированные ворота, отделявшие площадь от транспортной магистрали. За ними остановились две бронемашины «Гипериона», а из боковых дверей вышли вооружённые сотрудники в тёмной форме. Они заняли позиции у перекрёстков, выставили переносные сканеры и начали направлять прохожих к нескольким мобильным пунктам проверки. Всё выглядело как масштабная эвакуация, хотя людей, которые пытались пройти к центральной магистрали, разворачивали обратно без каких-либо объяснений.</p>

    <p>Айра крепче сжала руку Лины и повела её к южному проходу, пока там ещё оставалось свободное пространство. До выхода было несколько десятков метров, когда один из сканеров возле северного перекрёстка издал протяжный сигнал, а ближайшие бойцы одновременно повернулись в сторону технических корпусов. Почти сразу на площади отключилось освещение, и из динамиков донёсся новый приказ, на этот раз без привычного голоса городской системы.</p>

    <p>«Перекрыть южный выход. Начать проверку списка. Остальных направлять на идентификацию».</p>

    <p>Люди не сразу поняли, что услышали. Несколько человек попытались пройти дальше, но у выхода уже разворачивали металлические заграждения. Толпа остановилась, затем начала тесниться назад, сталкиваясь с теми, кто шёл навстречу. Айра развернулась, собираясь отвести Лину к переулку, однако в этот момент со стороны технических корпусов раздался взрыв. Ударная волна прокатилась по площади, выбив стёкла из ближайших павильонов; люди бросились в разные стороны, и Айру с сестрой разделило чужими плечами.</p>

    <p>Она успела увидеть, как Лина упала возле перевёрнутой торговой стойки, и тут же рванулась к ней, расталкивая людей. Когда Айра добралась до места, сестры там уже не было. На земле остался раскрытый рюкзак, из которого высыпались школьные тетради, а возле стойки лежала сломанная пластиковая заколка, которую Лина утром попросила починить. Айра подняла голову и начала звать её, сначала стараясь перекричать шум, а затем уже не обращая внимания на собственный голос, который срывался от напряжения.</p>

    <p>Она обыскала ближайшие проходы, заглянула за контейнеры и проверила вход в подземный переход, но всюду встречала людей, пытавшихся найти родственников или выбраться с площади. Один мужчина сказал, что видел девочку в серой куртке возле служебного транспорта у станции переработки. Другая женщина уверяла, что несколько детей увели к мобильному пункту проверки. Ни один из этих рассказов не совпадал с другим, однако Айра решила начать с ближайшего места, где находились машины «Гипериона».</p>

    <p>У служебного въезда она обнаружила несколько задержанных, которых бойцы проверяли по спискам на планшетах. Среди них были пожилые люди, двое подростков и женщина с маленьким ребёнком, но Лины нигде не оказалось. Айра попыталась пройти дальше, объясняя, что потеряла сестру во время эвакуации, однако один из сотрудников остановил её и потребовал предъявить документы. После проверки он сообщил, что ей следует обратиться в пункт регистрации гражданских лиц, расположенный на соседней улице, и не мешать работе подразделения.</p>

    <p>Айра уже собиралась уйти, когда заметила за ограждением служебную машину без обычной маркировки. Она стояла возле открытого въезда в технический тоннель, который использовали ремонтные бригады станции переработки. Рядом с машиной находился мужчина в тёмной форме, разговаривавший с двумя сотрудниками «Гипериона»; их разговор был слишком тихим, чтобы разобрать слова, но Айра успела заметить, как один из них передал мужчине планшет, а затем указал на группу задержанных, стоявших у стены.</p>

    <p>Мужчина посмотрел на экран и коротко кивнул. После этого он направился к людям, проверил документы у нескольких человек и остановился перед девочкой в серой куртке.</p>

    <p>Лина.</p>

    <p>Айра не сразу поняла, что видит именно сестру: та стояла между двумя взрослыми и казалась совершенно растерянной, а мужчина уже разговаривал с сопровождавшим её сотрудником. Айра выкрикнула имя Лины и попыталась обойти ограждение, но дежурный преградил ей путь. Она объяснила, что девочка — её сестра, назвала её имя и потребовала отпустить Лину, однако сотрудник лишь сверился с планшетом и ответил, что все перемещения осуществляются согласно распоряжению штаба.</p>

    <figure>
      <img src="covers/img-0791.jpg" alt="Айра и Лина возле машины">
      <figcaption>Момент разлуки</figcaption>
    </figure>

    <p>За ограждением мужчина что-то сказал сопровождавшему Лину бойцу. Тот проверил документы девочки ещё раз, после чего повёл её к служебной машине. Лина обернулась на голос сестры и увидела Айру, но между ними находились ограждение, несколько сотрудников и поток людей, которых продолжали направлять к пунктам проверки. Айра закричала снова, пытаясь привлечь внимание хоть кого-нибудь из стоявших рядом, однако мужчина уже открыл заднюю дверь машины и жестом велел Лине садиться.</p>

    <p>Она подчинилась не сразу. На мгновение задержалась возле двери, глядя на Айру с таким выражением, словно ждала, что та сейчас подойдёт и заберёт её домой. Затем сотрудник положил руку ей на плечо и помог забраться внутрь. Дверь закрылась, машина выехала с площадки и скрылась в техническом тоннеле, куда Айра не могла пройти из-за выставленного оцепления.</p>

    <p>Она продолжала требовать объяснений, пока дежурный не отвёл её к пункту регистрации, где собирали заявления о пропавших родственниках. Там ей пришлось назвать своё имя, идентификатор Лины, адрес проживания и обстоятельства исчезновения. Сотрудник обещал передать сведения в штаб эвакуации, но предупредил, что обработка заявлений займёт несколько дней, поскольку районные сети работают с перебоями.</p>

    <p>Мать вернулась домой под утро. Она не сразу заметила, что Айра сидит в коридоре в грязной куртке, с разбитыми ладонями и чужой кровью на рукаве; когда же поняла, что Лины нет рядом, несколько секунд молчала, словно пыталась найти объяснение, которое позволило бы не задавать следующий вопрос. Айра рассказала ей всё, что помнила, включая служебную машину и мужчину без опознавательных знаков. Мать выслушала её до конца, после чего собрала документы и отправилась в районное управление.</p>

    <p>Следующие дни превратились в череду одинаковых посещений учреждений. В одном месте утверждали, что Лина числится среди эвакуированных, в другом не находили её идентификатор, а в третьем отказывались принимать заявление без подтверждения того, что девочка вообще находилась на площади во время операции. Каждый раз матери приходилось начинать всё сначала, объяснять обстоятельства исчезновения и доказывать, что речь идёт о реальном человеке, а не об ошибке в базе данных.</p>

    <p>На шестой день сотрудник регистрационного центра сообщил, что сведения о Лине отсутствуют в доступных архивах. Он предположил, что данные могли быть повреждены во время аварии, и предложил подождать восстановления системы. Когда мать потребовала проверить журналы служебного транспорта, ей ответили, что эта информация относится к внутренним операциям «Гипериона» и не может быть предоставлена гражданским лицам.</p>

    <p>После этого мать перестала говорить о возвращении Лины в ближайшее время. Она продолжала искать информацию, но делала это осторожнее, избегая разговоров с соседями и не оставляя письменных обращений там, где их могли заметить посторонние. Однажды вечером Айра увидела, как мать убирает в металлическую коробку документы, фотографии и старые записи, связанные с их семьёй. На вопрос, зачем она это делает, мать ответила, что не хочет потерять последнее, что у них осталось.</p>

    <p>Айра не стала спорить. Она спрятала копии документов в вентиляционном отсеке под полом и запомнила все сведения, которые смогла собрать о той ночи: время начала операции, расположение оцепления, маршрут служебной машины и номер технического тоннеля, через который та исчезла. Тогда у неё не было ни навыков, ни ресурсов, чтобы проверить эти данные самостоятельно, но она решила, что однажды вернётся к ним и выяснит, что произошло с сестрой.</p>

    <figure>
      <img src="covers/img-0790.jpg" alt="Айра за взломом систем">
      <figcaption>Годы спустя</figcaption>
    </figure>

    <p>Годы спустя Айра научилась проникать в закрытые сети, восстанавливать повреждённые архивы и обходить защиту корпоративных систем. Она начинала с мелких заказов, постепенно бралась за более сложные операции и по ночам возвращалась к старым записям о Двенадцатом районе. Иногда ей удавалось обнаружить фамилию сотрудника, участвовавшего в эвакуации, или номер транспортного узла, связанного с перемещением задержанных, но каждый след заканчивался там, где начиналась закрытая инфраструктура «Гипериона».</p>

    <p>Однажды Айра получила доступ к резервной копии журнала управления транспортными узлами, созданной в ночь исчезновения Лины. Большая часть данных оказалась повреждена, а несколько разделов были удалены намеренно, однако в последовательности служебных операций сохранилась запись о машине, которая покинула станцию переработки через технический тоннель. Её регистрационный номер отсутствовал, маршрут был обозначен как внутреннее перемещение, а сведения о пассажирах не сохранились.</p>

    <p>В соседнем разделе обнаружилась ещё одна запись: неизвестная команда, отправленная в систему управления незадолго до отключения районной сети. Она не соответствовала ни одному из стандартных протоколов «Гипериона», а её происхождение невозможно было установить по сохранившимся метаданным. Айра восстановила повреждённую строку и увидела короткий ответ, оставленный в журнале без пояснений и указания адресата.</p>

    <p class="whisper">Не успели.</p>

    <p>Она проверила временные метки, сопоставила их с доступными сведениями об эвакуации и несколько раз запустила анализ восстановленного фрагмента. Команда появилась в системе за секунды до того, как связь с несколькими транспортными узлами была потеряна, но данных не хватало, чтобы понять, кто её отправил и к чему относилось сообщение. Возможно, кто-то пытался предупредить о происходящем, возможно, операция пошла не по плану, а возможно, эта запись вообще относилась к другому событию, случившемуся той же ночью.</p>

    <p>Айра сохранила копию журнала на автономный накопитель и вернулась к поиску. Впервые за много лет у неё появился цифровой след, который связывал исчезновение Лины с вмешательством неизвестного участника, однако он не объяснял ни причины исчезновения, ни того, почему корпоративные архивы оказались очищены так тщательно. Кто-то знал, что произошло в Двенадцатом районе, и кто-то не хотел, чтобы эта информация сохранилась.</p>

    <p>Спустя годы Айра столкнётся с тем же почерком в закрытых сетях «Гипериона», когда неизвестный противник начнёт опережать её в операциях, перехватывать данные и менять результаты взломов так, словно заранее знает её следующий шаг. Она назовёт его Фантомом, не подозревая, что за этим именем скрывается нечто гораздо сложнее, чем один талантливый хакер.</p>

    <p>Но в ту ночь, когда она впервые восстановила запись из архива, Айра ещё не знала ни имени своего будущего противника, ни того, что её поиски приведут к человеку, который годами работал внутри самой корпорации. Она просто смотрела на два слова в повреждённом журнале и пыталась понять, кто именно не успел — и кого уже было невозможно спасти.</p>
  </article>
</template>

<script>
const BOOKS = [
  {
    id: 'phantom',
    title: 'PHANTOM',
    author: 'Голубцов Александр',
    tagline: 'Двенадцатый район',
    cover: 'covers/cover.jpg',
    chapters: [
      {
        id: 'prologue',
        label: 'Пролог',
        title: 'Двенадцатый район',
        subtitle: 'Двенадцать лет назад',
        templateId: 'tpl-phantom-prologue'
      }
    ]
  }
];

const App = (() => {
  const tg = window.Telegram?.WebApp || null;
  const STORAGE_KEY = 'mini_app_books_progress_v1';

  if (tg) {
    try { tg.ready(); tg.expand(); if(tg.setHeaderColor) tg.setHeaderColor('#050508'); if(tg.setBackgroundColor) tg.setBackgroundColor('#050508'); if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch(e){}
  }

  function loadProgress() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; } }
  function saveProgress(data) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {} }
  function getBookProgress(bookId) { const p = loadProgress(); return p[bookId] || { lastChapter: 0, chapters: {} }; }
  function setChapterScroll(bookId, chapterId, ratio) {
    try {
      const all = loadProgress();
      if (!all[bookId]) all[bookId] = { lastChapter: 0, chapters: {} };
      if (!all[bookId].chapters) all[bookId].chapters = {};
      all[bookId].chapters[chapterId] = ratio;
      const book = BOOKS.find(b => b.id === bookId);
      if (book) all[bookId].lastChapter = book.chapters.findIndex(c => c.id === chapterId);
      saveProgress(all);
    } catch (e) {}
  }
  function getChapterScroll(bookId, chapterId) { return getBookProgress(bookId).chapters?.[chapterId] || 0; }
  function bookOverallProgress(book) {
    try {
      const p = getBookProgress(book.id); const total = book.chapters.length;
      if (!total) return 0;
      return book.chapters.reduce((acc, ch) => acc + Math.min(p.chapters?.[ch.id] || 0, 1), 0) / total;
    } catch (e) { return 0; }
  }
  function haptic(type = 'light') {
    if (!tg?.HapticFeedback) return;
    try { if (type === 'light') tg.HapticFeedback.impactOccurred('light'); else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium'); } catch {}
  }

  const views = { library: document.getElementById('view-library'), book: document.getElementById('view-book'), reader: document.getElementById('view-reader') };
  let current = 'library', activeBookId = null, activeChapterIndex = 0;

  function setView(name) {
    Object.values(views).forEach(v => v.classList.remove('active'));
    views[name].classList.add('active'); views[name].scrollTop = 0; current = name;
    if (tg?.BackButton) { if (name === 'library') tg.BackButton.hide(); else tg.BackButton.show(); }
  }

  function renderLibrary() {
    const list = document.getElementById('book-list'); list.innerHTML = '';
    BOOKS.forEach(book => {
      const progress = bookOverallProgress(book);
      const card = document.createElement('button'); card.className = 'book-card';
      card.innerHTML = `
        <div class="book-cover">
          ${book.cover ? `<img src="${book.cover}" alt="${escapeHtml(book.title)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'cover-fallback\\'>${escapeHtml(book.title)}</span>';">` : `<span class="cover-fallback">${escapeHtml(book.title)}</span>`}
        </div>
        <div class="book-info">
          <span class="tagline">${escapeHtml(book.tagline || '')}</span>
          <span class="title">${escapeHtml(book.title)}</span>
          <span class="author">${escapeHtml(book.author)}</span>
          <div class="book-progress">
            <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(progress*100)}%"></div></div>
            <span>${Math.round(progress*100)}%</span>
          </div>
        </div>`;
      card.addEventListener('click', () => { haptic('light'); openBook(book.id); });
      list.appendChild(card);
    });
  }

  function openBook(bookId) { const book = BOOKS.find(b => b.id === bookId); if (!book) return; activeBookId = bookId; renderBookView(book); setView('book'); }

  function renderBookView(book) {
    document.getElementById('book-topbar-title').textContent = book.title;
    const p = getBookProgress(book.id);
    const hasProgress = book.chapters.some(ch => (p.chapters?.[ch.id] || 0) > 0.01);
    const lastChapter = p.lastChapter || 0;
    const continueLabel = hasProgress ? 'Продолжить чтение' : 'Начать чтение';
    const container = document.getElementById('book-content');
    container.innerHTML = `
      <div class="book-hero">
        <div class="cover-frame">
          ${book.cover ? `<img src="${book.cover}" alt="${escapeHtml(book.title)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'cover-fallback\\'>${escapeHtml(book.title)}</span>';">` : `<span class="cover-fallback">${escapeHtml(book.title)}</span>`}
        </div>
        <h1 class="title-glitch">${escapeHtml(book.title)}</h1>
        <p class="author-name">${escapeHtml(book.author)}</p>
        <button class="btn-primary" id="continue-btn">${continueLabel}</button>
      </div>
      <div class="toc">
        <div class="toc-title">Содержание</div>
        ${book.chapters.map((ch, i) => {
          const r = p.chapters?.[ch.id] || 0; const read = r > 0.99;
          return `<button class="toc-item ${read ? 'read' : ''}" data-chapter="${i}"><span class="toc-num">${String(i+1).padStart(2,'0')}</span><div class="toc-info"><div class="toc-label">${escapeHtml(ch.label)}</div><div class="toc-name">${escapeHtml(ch.title)}</div></div><span class="toc-arrow">›</span></button>`;
        }).join('')}
      </div>`;
    container.querySelector('#continue-btn').addEventListener('click', () => { haptic('light'); openChapter(lastChapter); });
    container.querySelectorAll('.toc-item').forEach(el => { el.addEventListener('click', () => { haptic('light'); openChapter(parseInt(el.dataset.chapter, 10)); }); });
  }

  function goBook() { if (!activeBookId) return; renderBookView(BOOKS.find(b => b.id === activeBookId)); setView('book'); }

  function openChapter(index) {
    const book = BOOKS.find(b => b.id === activeBookId); if (!book) return; const ch = book.chapters[index]; if (!ch) return;
    activeChapterIndex = index; document.getElementById('reader-topbar-title').textContent = ch.label + ' · ' + book.title;
    const tpl = document.getElementById(ch.templateId); const readerContent = document.getElementById('reader-content');
    readerContent.innerHTML = tpl ? tpl.innerHTML : '<p>Контент не найден.</p>';
    const nav = document.createElement('div'); nav.className = 'chapter-nav';
    const prev = document.createElement('button'); prev.textContent = '‹ Назад'; prev.disabled = index === 0; prev.addEventListener('click', () => { haptic('light'); openChapter(index - 1); });
    const next = document.createElement('button'); next.textContent = 'Далее ›'; next.disabled = index >= book.chapters.length - 1; next.addEventListener('click', () => { haptic('light'); openChapter(index + 1); });
    nav.appendChild(prev); nav.appendChild(next);
    const end = document.createElement('div'); end.className = 'end-chapter'; end.innerHTML = '<div class="end-mark">Конец главы</div>';
    readerContent.appendChild(end); readerContent.appendChild(nav);
    setView('reader');
    const saved = getChapterScroll(book.id, ch.id);
    requestAnimationFrame(() => { const view = views.reader; view.scrollTop = saved * (view.scrollHeight - view.clientHeight); updateProgressBar(); });
  }

  let saveTimer = null;
  function updateProgressBar() {
    const view = views.reader; const max = view.scrollHeight - view.clientHeight; const ratio = max > 0 ? view.scrollTop / max : 0;
    document.getElementById('reader-progress').style.width = (ratio * 100) + '%';
    if (current === 'reader' && activeBookId) {
      const book = BOOKS.find(b => b.id === activeBookId);
      if (book && book.chapters[activeChapterIndex]) {
        clearTimeout(saveTimer); saveTimer = setTimeout(() => { setChapterScroll(activeBookId, book.chapters[activeChapterIndex].id, ratio); }, 400);
      }
    }
  }
  views.reader.addEventListener('scroll', updateProgressBar, { passive: true });

  function goLibrary() { haptic('light'); activeBookId = null; renderLibrary(); setView('library'); }
  function onBackButton() { if (current === 'reader') { haptic('light'); goBook(); } else if (current === 'book') { haptic('light'); goLibrary(); } else if (tg) tg.close?.(); }
  if (tg?.BackButton) { tg.BackButton.onClick(onBackButton); tg.BackButton.hide(); }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function init() {
    try { renderLibrary(); setView('library'); } catch (e) { console.error(e); document.getElementById('book-list').innerHTML = `<div style="color:red; padding: 20px;">Ошибка: ${e.message}</div>`; }
  }
  return { init, goLibrary, goBook };
})();

if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', App.init); } else { App.init(); }
</script>
</body>
</html>
