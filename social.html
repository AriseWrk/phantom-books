<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Соцсети - ARISE</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .social-list { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .social-item { display: flex; align-items: center; gap: 15px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 18px; text-decoration: none; color: #fff; transition: 0.2s; backdrop-filter: blur(10px); }
        .social-item:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.1); }
        .social-item svg { width: 30px; height: 30px; stroke: #ff4b4b; flex-shrink: 0; }
        .social-item div { display: flex; flex-direction: column; text-align: left; }
        .social-item strong { font-size: 1rem; margin-bottom: 2px; }
        .social-item span { font-size: 0.8rem; color: #888; }
    </style>
</head>

                <a href="https://t.me/ariseliterature" target="_blank" class="social-item">
